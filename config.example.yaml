# Copy to config.yaml and edit.

profile: profile.yaml        # your master profile (see profile.example.yaml)
database: jobbot.db          # tracks every job seen and what happened to it
output_dir: output           # tailored resumes / cover letters / screenshots go here
model: claude-opus-5-5

search:
  # A job passes if any keyword is in the title (or 2+ appear in the description).
  keywords: ["software engineer", "backend", "python", "platform engineer"]
  exclude_keywords: ["staff", "principal", "director", "intern", "manager"]
  locations: ["New York", "NYC", "Remote - US", "United States"]
  remote_ok: true            # remote jobs pass even if location doesn't match
  max_age_days: 30

# Company "slugs" = the part of their careers URL:
#   job-boards.greenhouse.io/<slug>    jobs.lever.co/<slug>    jobs.ashbyhq.com/<slug>
# Add the companies you want to work for. Unknown slugs are reported and skipped.
sources:
  greenhouse: [stripe, airbnb, datadog, figma, discord]
  lever: [plaid, palantir]
  ashby: [ramp, notion, linear]
  remotive:                  # remote-job aggregator: discovery + documents only, you apply manually
    enabled: false
    searches: ["python developer"]

matching:
  min_score: 70              # Claude's 0-100 fit score needed to prepare an application
  max_jobs_to_score: 50      # cost cap per `find` run

documents:
  cover_letter: when_accepted   # when_accepted | always | never
  formats: [pdf, docx]          # PDF is always made (it's what gets uploaded)

apply:
  mode: review               # review = you click Submit; auto = submits when confident
  max_per_run: 10
  max_per_day: 25
  delay_seconds: 20          # pause between auto submissions
  headless: false            # only used in auto mode
