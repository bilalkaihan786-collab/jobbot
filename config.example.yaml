# Copy to config.yaml and edit.

profile: profile.yaml        # your master profile (see profile.example.yaml)
database: jobbot.db          # tracks every job seen and what happened to it
output_dir: output           # tailored resumes / cover letters / screenshots go here

# Which AI writes the scores, resumes and form answers:
#   claude = Claude via the Anthropic API (best results; needs ANTHROPIC_API_KEY, small cost)
#   ollama = a free model running on your own computer (install https://ollama.com)
#   auto   = claude if ANTHROPIC_API_KEY is set, otherwise ollama
provider: auto
model: claude-opus-5-5       # used when provider is claude
ollama:
  model: qwen2.5:7b          # run `ollama pull qwen2.5:7b` once first
  host: http://localhost:11434
  num_ctx: 16384             # context window; lower to 8192 if your PC runs out of memory
  timeout_seconds: 900       # local models can be slow, especially without a GPU

search:
  # jobs        = regular roles (titles with "intern" etc. can be excluded below)
  # students    = student-friendly work: summer jobs, part-time during school, co-ops, internships.
  #               Scored on student eligibility instead of years of experience; resumes list
  #               Education first.
  # internships = only postings whose title says internship / co-op / student
  focus: students
  # A job passes if any keyword is in its title (or appears in the description).
  # Tuned for Kinesiology + French: research, clinical/medical, French teaching, bilingual government.
  keywords: [research, kinesiology, kinesiologist, rehabilitation, physiotherapy, exercise, health,
             clinic, clinical, hospital, medical, patient, lab, laboratory, french, bilingual,
             francophone, tutor, teacher, teaching, instructor, educator, government, student]
  # Titles needing a finished degree or licence, plus unrelated fields.
  exclude_keywords: [senior, manager, director, principal, chief, physician, surgeon, pharmacist,
                     dentist, registered nurse, nurse practitioner, psychologist, engineer,
                     developer, software, sales, driver]
  locations: []              # empty = anywhere in the search area; or e.g. [Ottawa, Toronto, Ontario]
  remote_ok: true            # remote jobs pass even if location doesn't match
  max_age_days: 30

# Where jobs come from.
sources:
  # Adzuna searches thousands of employers (hospitals, universities, school boards, governments).
  # Get a free app_id and app_key at https://developer.adzuna.com (Register), then paste them here
  # or on the Preferences tab. You apply on the employer's site; jobbot prepares the resume and
  # cover letter.
  adzuna:
    enabled: true
    country: ca              # ca, us, gb, fr, ...
    where: ""                # city or province, e.g. Ottawa; empty = whole country
    app_id: ""
    app_key: ""
    searches: [research assistant, kinesiology, rehabilitation assistant, physiotherapy assistant,
               clinical research, hospital student, summer student health, french tutor,
               french teacher, bilingual student, bilingual government]
  # Company "slugs" = the part of their careers URL:
  #   job-boards.greenhouse.io/<slug>    jobs.lever.co/<slug>    jobs.ashbyhq.com/<slug>
  # For specific employers that use these systems (jobbot can fill their forms).
  greenhouse: []
  lever: []
  ashby: []
  remotive:                  # remote-job aggregator (mostly tech): discovery only
    enabled: false
    searches: []

matching:
  min_score: 70              # Claude's 0-100 fit score needed to prepare an application
  max_jobs_to_score: 50      # cost cap per `find` run

documents:
  cover_letter: when_accepted   # when_accepted | always | never
  formats: [pdf, docx]          # PDF is always made (it's what gets uploaded)

apply:
  mode: review               # review = you click Submit; auto = submits when confident
  max_per_run: 10
  max_per_day: 25
  delay_seconds: 20          # pause between auto submissions
  headless: false            # only used in auto mode
