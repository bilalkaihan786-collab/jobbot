# EXAMPLE PROFILE for a Kinesiology + French student. Replace EVERYTHING with your real details.
# jobbot picks and rephrases from this file for each job and never adds anything that isn't here,
# so more true detail = better resumes. Volunteer work, labs, coaching and tutoring all count.
#
# Safety lock: jobbot won't write resumes or fill applications while the next line is here.
# Delete it once this file describes you.
example_profile: true

name: Your Name
first_name: Your
last_name: Name
email: your.email@example.com
phone: "+1 555 555 0100"
location: Ottawa, ON
links:
  linkedin: ""
  website: ""

summary: >
  Kinesiology and French student with hands-on experience in rehabilitation, exercise testing
  and French tutoring.

# Shown on every resume. Say how well you speak, read and write each one.
languages:
  - English (native)
  - French (fluent, spoken and written)

experience:
  - id: clinic
    company: Example Physiotherapy Clinic
    title: Rehabilitation Assistant (part-time)
    location: Ottawa, ON
    start: Sep 2025
    end: Present
    bullets:
      - Set up exercise equipment and guided patients through home-exercise programs under physiotherapist supervision
      - Cleaned and prepared treatment areas, and kept patient appointment records up to date
  - id: tutor
    company: Self-employed
    title: French Tutor
    location: Ottawa, ON
    start: Jan 2024
    end: Present
    bullets:
      - Tutor 5 high-school students weekly in French grammar, writing and oral expression
  - id: camp
    company: City of Ottawa
    title: Bilingual Day Camp Counsellor (summer)
    location: Ottawa, ON
    start: Jun 2024
    end: Aug 2024
    bullets:
      - Led daily activities for groups of 12 children in English and French

projects:
  - id: labproject
    name: Exercise physiology lab project
    url: ""
    description: Measured heart-rate recovery in 20 participants and presented the results to the class

skills:
  health: [exercise prescription basics, anthropometric measurements, blood pressure measurement]
  research: [data entry, Excel, participant scheduling]
  teaching: [lesson planning, French grammar instruction]

# Students: put your program, year and expected graduation in `details`.
# For student jobs and internship postings the resume lists Education first.
education:
  - degree: B.Sc. Kinesiology and B.A. French (double major)
    school: Your University
    year: Expected 2028
    details: "Year 2 · Coursework: Exercise Physiology, Human Anatomy, Biomechanics, French Linguistics"

certifications: [Standard First Aid & CPR-C]

# What you want - used when scoring jobs. Also editable on the Preferences tab.
preferences:
  seniority: student (summer, part-time, co-op)
  schedule: [summer, part-time, co-op]
  targets:
    - research assistant roles in kinesiology or health research
    - clinical, hospital or rehabilitation settings
    - teaching or tutoring French
    - government jobs that require French or bilingualism
  work_mode: in person or hybrid
  avoid: []
  internship_term: "Summer 2027"

# Answers to questions that show up on most applications. Fill in your own.
# Anything not covered here that the AI can't answer from the profile is left for you.
application_answers:
  work_authorization: ""        # e.g. "Canadian citizen"
  requires_sponsorship: ""      # e.g. "No"
  willing_to_relocate: ""
  earliest_start_date: ""       # e.g. "May 2027"
  enrolled_full_time: ""        # e.g. "Yes, returning to full-time studies in September 2027"
  how_did_you_hear: Job board
  pronouns: ""

# Voluntary self-identification. Leave a key out (or empty) and jobbot will
# choose "decline to self-identify". Never sent anywhere except these forms.
eeo:
  gender: ""
  race_ethnicity: ""
  veteran_status: ""
  disability_status: ""
